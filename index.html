<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#101b22" />
    <meta
      name="description"
      content="Baakanya helps Botswana create, convert and organise professional documents."
    />
    <link id="baakanya-favicon" rel="icon" type="image/png" sizes="32x32" />
    <link id="baakanya-shortcut" rel="shortcut icon" />
    <link id="baakanya-apple-icon" rel="apple-touch-icon" />
    <script>
      (function () {
        var icon = "/Baakanya/baakanya-mark.png?v=3";
        document.getElementById("baakanya-favicon").href = icon;
        document.getElementById("baakanya-shortcut").href = icon;
        document.getElementById("baakanya-apple-icon").href = icon;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Baakanya — Documents, sorted.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var route = new URLSearchParams(window.location.search).get("route");
        if (route) {
          window.history.replaceState(null, "", "/Baakanya" + route);
          return;
        }
        if (window.location.hash.indexOf("#/") === 0) {
          window.history.replaceState(
            null,
            "",
            "/Baakanya" + window.location.hash.slice(1),
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
